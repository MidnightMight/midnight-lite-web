<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Midnight Lite · Editor</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
  <!-- Sveltia CMS: edits the Markdown/JSON in the GitHub repo and commits. Cloudflare then redeploys the site. Config: config.yml -->
  <script>
    // Save to the branch this copy of the site was built from:
    // nuc-astro.midnight-lite-web.pages.dev/admin -> branch nuc-astro; www.midnight-lite.com/admin -> main (config.yml).
    window.CMS_MANUAL_INIT = true;
    const m = location.hostname.match(/^([a-z0-9-]+)\.midnight-lite-web\.pages\.dev$/);
    window.EDIT_BRANCH = m && !/^[0-9a-f]{8}$/.test(m[1]) ? m[1] : "main";
  </script>
  <script src="https://unpkg.com/@sveltia/cms@0.227.2/dist/sveltia-cms.js"></script>
  <script>
    CMS.init({ config: { backend: { branch: window.EDIT_BRANCH } } });
    if (window.EDIT_BRANCH !== "main") document.title = `Editor (preview: ${window.EDIT_BRANCH})`;
  </script>
</body>
</html>
