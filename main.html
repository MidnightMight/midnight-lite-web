<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>COMING SOON</h1>
        <div class="countdown">
            <div class="time" id="days">0</div>
            <div class="label">DAYS</div>
            <div class="time" id="hours">0</div>
            <div class="label">HOURS</div>
            <div class="time" id="minutes">0</div>
            <div class="label">MINUTES</div>
            <div class="time" id="seconds">0</div>
            <div class="label">SECONDS</div>
        </div>
        <button id="notifyBtn">Notify Me!</button>
        <form id="subscribeForm">
            <input type="email" id="email" placeholder="Enter your email address" required>
            <button type="submit">Notify Me!</button>
        </form>
        <p class="description">I am still making this website.... will start soon</p>
        <footer>Created By Midnight Lite</footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
